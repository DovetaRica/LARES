name: public-release-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m home_ai demo
      - run: python -m home_ai replay home_ai/examples/automation_correction.jsonl
      - run: python -m home_ai validate-config --config config/example.json
      - run: python scripts/check_public.py
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_release.py --ref HEAD --out dist/ci
      - run: python scripts/smoke_distributions.py dist/ci
      - run: python scripts/check_public.py --artifact dist/ci
