[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-ai-exceptions"
version = "0.2.0a1"
description = "LARES: observation-first exception intelligence for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
[project.optional-dependencies]
ha = ["websockets==15.0.1"]
app = ["fastapi==0.141.1", "uvicorn==0.35.0", "websockets==15.0.1", "httpx==0.28.1", "PyYAML==6.0.2", "APScheduler==3.11.0", "pydantic-settings==2.10.1", "jinja2==3.1.6", "tzdata==2025.2"]
[project.scripts]
home-ai = "home_ai.cli:main"
lares-app = "app.main:main"
[tool.setuptools.packages.find]
include = ["home_ai*", "app*"]

[tool.setuptools.package-data]
home_ai = ["examples/*.jsonl"]
app = ["templates/*.html", "static/*", "resources/*.yaml", "resources/*.json", "resources/prompts/*.txt"]

[project.urls]
Source = "https://github.com/DovetaRica/LARES"
Issues = "https://github.com/DovetaRica/LARES/issues"
Documentation = "https://github.com/DovetaRica/LARES/blob/main/docs/deployment.md"
